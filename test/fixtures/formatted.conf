#!MANAGED-CONFIG https://example.com/config interval=86400 strict=true

[General]
loglevel = notify
skip-proxy = 127.0.0.1, 192.168.0.0/16, 10.0.0.0/8
dns-server = 119.29.29.29, 223.5.5.5, system
ipv6 = true
test-timeout = 3
doh-server = https://dns.alidns.com/dns-query

[Proxy]
MyProxy = ss, server.com, 443, encrypt-method=aes-256-gcm, password=pwd
Office = http, proxy.corp.com, 8080, admin, password
JP-Trojan = trojan, jp.example.com, 443, password=pwd, sni=jp.example.com, tfo=true, skip-cert-verify=true

[Proxy Group]
Proxy = select, MyProxy, Office, JP-Trojan, DIRECT
Auto = url-test, MyProxy, Office, JP-Trojan, url=http://test.com, interval=300, tolerance=50

[Rule]
DOMAIN-SUFFIX,example.com,DIRECT
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
GEOIP,CN,DIRECT
FINAL,Proxy,dns-failed

[Host]
nas.home = 192.168.1.200
router.local = server:system
*.dev.corp.com = server:10.0.1.1

[URL Rewrite]
^https?://ads\.example\.com/ - reject
^http://old\.site\.com/(.*) https://new.site.com/$1 302

[Script]
Feed-Cleaner = type=http-response, pattern=^https://api\.example\.com/feed, script-path=clean.js, requires-body=true, max-size=3145728
Daily-Check = type=cron, cronexp="0 8 * * *", script-path=daily.js, timeout=120

[MITM]
skip-server-cert-verify = false
h2 = true
hostname = api.example.com, *.ads.example.com
