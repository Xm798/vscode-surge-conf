# Surge Proxy & Proxy Group Configuration
# Covers all supported protocols and group types

[Proxy]
# --- Direct & Reject ---
DIRECT = direct
REJECT = reject

# --- HTTP/HTTPS ---
Office-HTTP = http, proxy.corp.example.com, 8080, username, password
Office-HTTPS = https, tls-proxy.corp.example.com, 443, username, password, skip-cert-verify=true, sni=proxy.corp.example.com

# --- SOCKS5 ---
Datacenter-SOCKS = socks5, socks.dc-east.example.com, 1080, admin, s3cretP@ss
Datacenter-SOCKS-TLS = socks5-tls, socks-tls.dc-east.example.com, 1443, admin, s3cretP@ss, skip-cert-verify=false, sni=socks-tls.dc-east.example.com

# --- Snell ---
Tokyo-Snell = snell, snell-jp01.fastnet.io, 13432, psk=grHf7xL0Qk5PwYzn, version=4, reuse=true, tfo=true

# --- Shadowsocks ---
HK-SS = ss, hk03.shadowlink.io, 8388, encrypt-method=chacha20-ietf-poly1305, password=5bYbNkaq92qKhR9p, udp-relay=true, tfo=true
SG-SS-Obfs = ss, sg01.shadowlink.io, 443, encrypt-method=aes-256-gcm, password=kG3bF8vLm9, obfs=tls, obfs-host=download.windowsupdate.com

# --- VMess ---
US-VMess = vmess, vmess-us02.cloudproxy.net, 443, username=a3482e88-686a-4a58-8126-99c9df64b060, tls=true, vmess-aead=true, ws=true, ws-path=/stream, ws-headers="Host:cdn.cloudproxy.net", skip-cert-verify=false

# --- Trojan ---
JP-Trojan = trojan, trojan-jp05.relayservice.xyz, 443, password=dGhpcyBpcyBhIHRyb2phbiBwYXNzd29yZA, sni=trojan-jp05.relayservice.xyz, skip-cert-verify=false, tfo=true
TW-Trojan-WS = trojan, trojan-tw01.relayservice.xyz, 443, password=aW5zZWN1cmUgcGFzc3dvcmQ, ws=true, ws-path=/trojan, sni=cdn.relayservice.xyz

# --- TUIC ---
KR-TUIC = tuic, tuic-kr01.speednode.net, 8443, token=7db6b0e2-5d3a-4e5c-9f1a-1a2b3c4d5e6f, alpn=h3, skip-cert-verify=false, sni=tuic-kr01.speednode.net

# --- Hysteria 2 ---
DE-Hysteria2 = hysteria2, hy2-de01.fastrelays.com, 8443, password=xK9mP2vL8nR3, download-bandwidth=200, skip-cert-verify=false, sni=hy2-de01.fastrelays.com, ecn=true

# --- AnyTLS ---
US-AnyTLS = anytls, anytls-us03.secureproxy.io, 443, password=jM5kL9nP2xR7, sni=anytls-us03.secureproxy.io, server-cert-fingerprint-sha256=a]1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0

# --- SSH ---
DevServer-SSH = ssh, dev-bastion.internal.example.com, 22, username=deploy, private-key=DeployKey1

# --- WireGuard ---
HomeVPN-WG = wireguard, section-name=HomeVPN, underlying-proxy=JP-Trojan

# --- ShadowTLS wrapping ---
SG-ShadowTLS = ss, sg-shadow.example.com, 443, encrypt-method=aes-256-gcm, password=pR3xK9mL, shadow-tls-password=tls-s3cret, shadow-tls-sni=gateway.icloud.com, shadow-tls-version=3

# --- Chaining (underlying-proxy) ---
US-Chained = trojan, us-exit.chainrelay.net, 443, password=Y2hhaW4tcHJveHk, underlying-proxy=HK-SS, tfo=true, skip-cert-verify=false


[Proxy Group]
# --- Manual Selection ---
Proxy = select, HK-SS, SG-SS-Obfs, JP-Trojan, US-VMess, KR-TUIC, DE-Hysteria2, US-AnyTLS, Tokyo-Snell, include-all-proxies=true, no-alert=false

# --- Automatic Testing ---
Auto-Fast = url-test, HK-SS, SG-SS-Obfs, JP-Trojan, TW-Trojan-WS, url=http://latency-test.skk.moe/endpoint, interval=300, tolerance=50, timeout=3

# --- Fallback ---
Fallback-Primary = fallback, JP-Trojan, TW-Trojan-WS, HK-SS, US-VMess, url=http://connectivitycheck.gstatic.com/generate_204, interval=600, timeout=3

# --- Load Balance ---
LB-Media = load-balance, US-VMess, US-AnyTLS, US-Chained, persistent=true, url=http://latency-test.skk.moe/endpoint, interval=600

# --- Subnet ---
Office-Switch = subnet, default=Proxy, "TYPE:WIFI"=Office-HTTP, "SSID:CorpNet"=DIRECT, "SSID:HomeWifi"=HomeVPN-WG

# --- Smart (auto-select strategy) ---
Smart-Route = smart, Proxy, Auto-Fast, DIRECT, url=http://connectivitycheck.gstatic.com/generate_204

# --- External Policy Path ---
Subscription = select, policy-path=https://sub.example.com/api/surge?token=abc123def, update-interval=86400, policy-regex-filter=(?=.*(US|JP|HK|SG))^((?!expired).)*$

# --- Include Other Group ---
Global = select, Proxy, Auto-Fast, Fallback-Primary, LB-Media, DIRECT, include-other-group="Auto-Fast, Fallback-Primary", hidden=false, no-alert=true

# --- External Policy Modifier ---
Modified-Sub = select, policy-path=https://sub.example.com/api/surge2, external-policy-modifier="PROXY-NAME-PREFIX=Sub-, PROXY-FILTER-TYPE=INCLUDE, PROXY-FILTER=(?i)(premium|vip)"
