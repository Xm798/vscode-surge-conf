# Phase 2 Keyword Highlighting Tests

[Proxy]
# All protocol keywords
P1 = http, proxy.example.com, 8080
P2 = https, proxy.example.com, 443
P3 = socks5, socks.example.com, 1080
P4 = socks5-tls, socks.example.com, 1443
P5 = snell, snell.example.com, 13432, psk=key, version=4
P6 = ss, ss.example.com, 8388, encrypt-method=chacha20-ietf-poly1305, password=pwd
P7 = vmess, vmess.example.com, 443, username=uuid, tls=true, vmess-aead=true
P8 = trojan, trojan.example.com, 443, password=pwd, sni=trojan.example.com
P9 = tuic, tuic.example.com, 8443, token=uuid, alpn=h3
P10 = hysteria2, hy2.example.com, 8443, password=pwd, download-bandwidth=200
P11 = anytls, anytls.example.com, 443, password=pwd
P12 = ssh, bastion.example.com, 22, username=root, private-key=MyKey
P13 = wireguard, section-name=MyVPN
P14 = direct
P15 = reject

# Parameter keywords (key=value after comma)
Full-Proxy = trojan, server.com, 443, password=pwd, skip-cert-verify=true, tfo=true, sni=server.com, underlying-proxy=P1, shadow-tls-password=key, shadow-tls-sni=cdn.com, shadow-tls-version=3, block-quic=auto, test-url=http://test.com, test-timeout=5, ecn=true

[Proxy Group]
# All group type keywords
G1 = select, P1, P2, P3, DIRECT, include-all-proxies=true, no-alert=false, hidden=false
G2 = url-test, P1, P2, url=http://test.com, interval=300, tolerance=50, timeout=3, evaluate-before-use=true
G3 = fallback, P1, P2, DIRECT, url=http://test.com, interval=600
G4 = load-balance, P1, P2, persistent=true
G5 = subnet, default=Proxy, "TYPE:WIFI"=P1, "SSID:Home"=DIRECT
G6 = smart, P1, P2, DIRECT
External = select, policy-path=https://sub.example.com/api, update-interval=86400, policy-regex-filter=HK|JP, external-policy-modifier="PROXY-NAME-PREFIX=Sub-", include-other-group="G1"

[URL Rewrite]
# Rewrite action keywords
^https?://ads\.example\.com/ - reject
^http://old\.site\.com/(.*) https://new.site.com/$1 302
^http://redirect\.com/(.*) https://redirect.com/$1 307
^http://cdn\.old\.com/(.*) https://cdn.new.com/$1 header

[Header Rewrite]
# Direction keywords
http-request ^https://api\.example\.com/ header-add X-Client Surge
http-response ^https://api\.example\.com/ header-del X-Powered-By
http-request ^https://api\.example\.com/ header-replace User-Agent "Custom-Agent"
http-request ^https://api\.example\.com/ header-replace-regex Accept-Language ^zh.* en-US

[Body Rewrite]
# All direction keywords including JQ variants
http-request ^https://api\.example\.com/config "debug:true" "debug:false"
http-response ^https://api\.example\.com/feed "ads:\[.*?\]" "ads:[]"
http-request-jq ^https://api\.example\.com/submit .metadata.client = "surge"
http-response-jq ^https://api\.example\.com/data .items |= map(select(.type != "ad"))

[Map Local]
# data-type parameter values
^https://api\.ads\.com/config data-type=text data="{}" status-code=200
^https://cdn\.tracker\.com/sdk data-type=file data=blank.js
^https://pixel\.analytics\.com/ data-type=tiny-gif
^https://telemetry\.com/report data-type=base64 data=e30= status-code=204

[Script]
# All script type keywords
S1 = type=http-request,pattern=^https://api\.example\.com,script-path=req.js,timeout=10
S2 = type=http-response,pattern=^https://api\.example\.com,script-path=resp.js,requires-body=true,max-size=3145728
S3 = type=cron,cronexp="0 8 * * *",script-path=cron.js,timeout=120,wake-system=true
S4 = type=event,event-name=network-changed,script-path=event.js,timeout=20
S5 = type=dns,script-path=dns.js,timeout=10
S6 = type=rule,script-path=rule.js,timeout=10
S7 = type=generic,script-path=generic.js,timeout=60

[Panel]
# Panel parameter keywords
Info = title="Status",content="OK",style=good,update-interval=600,script-name=S2,icon=globe,icon-color=#4A90D9

[SSID Setting]
# SSID prefix keywords
SSID:HomeWifi suspend=false
SSID:CoffeeShop suspend=true
TYPE:WIFI cellular-fallback=off
TYPE:WIRED cellular-fallback=off
TYPE:CELLULAR mif-allowed=true
DEFAULT cellular-mode=true
