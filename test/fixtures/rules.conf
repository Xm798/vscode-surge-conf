# Surge Rules Configuration
# Comprehensive coverage of all rule types and built-in policies

[Rule]
# ==============================
# Domain-based Rules
# ==============================
DOMAIN,www.google.com,Proxy
DOMAIN,api.openai.com,Proxy
DOMAIN-SUFFIX,googleapis.com,Proxy
DOMAIN-SUFFIX,github.com,Proxy
DOMAIN-SUFFIX,githubusercontent.com,Proxy
DOMAIN-KEYWORD,google,Proxy
DOMAIN-KEYWORD,twitter,Proxy
DOMAIN-KEYWORD,facebook,Proxy
DOMAIN-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/proxy.txt,Proxy

# ==============================
# IP-based Rules
# ==============================
IP-CIDR,192.168.0.0/16,DIRECT
IP-CIDR,10.0.0.0/8,DIRECT
IP-CIDR,172.16.0.0/12,DIRECT
IP-CIDR,100.64.0.0/10,DIRECT
IP-CIDR,127.0.0.0/8,DIRECT
IP-CIDR,224.0.0.0/4,DIRECT ; multicast
IP-CIDR6,::1/128,DIRECT
IP-CIDR6,fc00::/7,DIRECT
IP-CIDR6,fe80::/10,DIRECT,no-resolve
GEOIP,CN,DIRECT
GEOIP,US,Proxy,no-resolve
IP-ASN,13335,Proxy // Cloudflare
IP-ASN,8075,Proxy,no-resolve // Microsoft

# ==============================
# HTTP Matching Rules
# ==============================
USER-AGENT,*com.apple.mobilesafari*,DIRECT
USER-AGENT,YouTube*,Proxy
USER-AGENT,Netflix*,Proxy
URL-REGEX,^https?://ads\..*\.com/,REJECT-TINYGIF
URL-REGEX,^https?://analytics\.google\.com/,REJECT

# ==============================
# Process-based Rules
# ==============================
PROCESS-NAME,Telegram,Proxy
PROCESS-NAME,clash,DIRECT
PROCESS-NAME,v2ray,DIRECT
PROCESS-NAME,ss-local,DIRECT

# ==============================
# Port-based Rules
# ==============================
DEST-PORT,22,DIRECT // SSH traffic
DEST-PORT,853,Proxy // DNS over TLS
DEST-PORT,8443,Proxy
IN-PORT,6152,Proxy
SRC-PORT,68,DIRECT # DHCP client

# ==============================
# Subnet Rule
# ==============================
SUBNET,SSID:CorpNet,Office-HTTP
SUBNET,TYPE:CELLULAR,Proxy

# ==============================
# Protocol Rules
# ==============================
PROTOCOL,UDP,DIRECT
PROTOCOL,QUIC,REJECT-NO-DROP
PROTOCOL,STUN,REJECT-DROP
PROTOCOL,DOH,Proxy
PROTOCOL,DOH3,Proxy
PROTOCOL,DOQ,Proxy

# ==============================
# Source IP
# ==============================
SRC-IP,192.168.1.100,DIRECT
SRC-IP,10.0.1.0/24,Proxy

# ==============================
# Logical Rules (double-parenthesis nesting)
# ==============================
AND,((DOMAIN-SUFFIX,icloud.com),(SRC-IP,192.168.1.0/24)),DIRECT
AND,((PROTOCOL,UDP),(DEST-PORT,443)),REJECT-DROP // block QUIC on 443
OR,((DOMAIN-KEYWORD,speedtest),(DOMAIN-KEYWORD,fast)),DIRECT
OR,((GEOIP,US),(GEOIP,CA)),Proxy
NOT,((DOMAIN-SUFFIX,cn)),Proxy

# Nested logical rules
AND,((OR,((DOMAIN-SUFFIX,google.com),(DOMAIN-SUFFIX,gstatic.com))),(NOT,((SRC-IP,10.0.0.0/8)))),Proxy

# ==============================
# Rule Sets
# ==============================
RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/ruleset/proxy.txt,Proxy
RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/ruleset/direct.txt,DIRECT
RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/ruleset/reject.txt,REJECT
RULE-SET,SYSTEM,Proxy
RULE-SET,LAN,DIRECT
RULE-SET,https://rules.example.com/adblock.list,REJECT-TINYGIF,no-resolve
RULE-SET,https://rules.example.com/streaming.list,Proxy,extended-matching

# ==============================
# Built-in Policies Showcase
# ==============================
DOMAIN-SUFFIX,ad-delivery.net,REJECT
DOMAIN-SUFFIX,tracker.example.com,REJECT-TINYGIF
DOMAIN-SUFFIX,telemetry.example.com,REJECT-DROP
DOMAIN-SUFFIX,required-telemetry.example.com,REJECT-NO-DROP

# ==============================
# Final (must be last)
# ==============================
FINAL,Proxy,dns-failed
