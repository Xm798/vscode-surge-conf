# Edge case tests for grammar validation

[General]
# Hash in value without space — should NOT be a comment
test-url = http://example.com/path#fragment
color-key = value#notacomment

# Semicolon in value — should NOT be a comment
url-with-semicolon = http://example.com/path;param=1

# Double-slash in URL — should NOT be a comment
doh-server = https://dns.google/dns-query
proxy-test-url = http://latency-test.skk.moe/endpoint

# Multiple = signs — only first should be operator
description = key=value pairs in config = flexible

# Boolean values
ipv6 = true
tls-verify = false

# Percentage — should NOT be placeholder
download-limit = 100%
bandwidth = 50%

# IPv6 addresses
skip-proxy = ::1, fe80::/10, fd00:db8::1, 2001:db8:85a3::8a2e:370:7334

[Rule]
# URL with // that is not a comment
URL-REGEX,^https?://ads\.example\.com/track,REJECT
IP-ASN,13335,Proxy // Cloudflare — this IS a comment

# All built-in policies
DOMAIN-SUFFIX,direct.test,DIRECT
DOMAIN-SUFFIX,reject.test,REJECT
DOMAIN-SUFFIX,tinygif.test,REJECT-TINYGIF
DOMAIN-SUFFIX,drop.test,REJECT-DROP
DOMAIN-SUFFIX,nodrop.test,REJECT-NO-DROP

# Phase 2 edge cases

[Proxy]
# "http" in hostname should NOT highlight as protocol keyword
NotProtocol = trojan, http-relay.example.com, 443, password=pwd

# "select" in proxy name should NOT highlight as group type
select-best = ss, server.com, 443, encrypt-method=aes-256-gcm, password=pwd

[Script]
# type= followed by value — only the value should be keyword, not "type" in other contexts
Content-Type-Check = type=http-response,pattern=^https://content-type\.example\.com,script-path=check.js

[URL Rewrite]
# Regex with special characters — should be highlighted as regex
^https?://api\.example\.com/v\d+/(?:ads|tracking)/.*\?callback= - reject
